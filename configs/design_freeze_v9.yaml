      gaps_all_required: [30, 90, 180]
      forbidden: selecting_any_horizon_after_seeing_envelope
      purpose: sensitivity_whether_strong_models_change_recoverability_calibration
      not_t2_primary_y: true
      pgdl_or_graph_wavenet: remains_on_roster_same_tier_2_budget_not_a_posthoc_drop
  required_predictors:
