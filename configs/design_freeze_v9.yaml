failure_closure: >
  Accept path is T1-T7. If T3 fails but T1, T2, T4, T5, and T7 hold,
  downgrade the title from decision to predictability; do not retune to
  rescue novelty. If the operator is no better than donor R2, retitle to
  predictability. If placement wins only single-digit percent versus
  random, headline on triage (b). If the Gaussian second-order model
  fails PIT/QQ, keep monotonicity and switch to quantile-width. If
  qualified networks fall below 100, relax to 3 stations / 6 years and
  report the relaxation. If the sealed primary criterion misses, write
  the miss in the ledger; do not unfreeze. The historical two-network
  manuscript remains a descriptive case study. If E5 Twin E misses,
  write a negative result; do not retune phi or noise. If grouping
  fails, stop at catalog level; do not download the name-HUC2 98-list
  and do not sell reviewer 161 or W1-A catalog 166 as T2 or as extra
  rivers by loosening. If
  n<100, withhold network CIs; 12-river and 6-river pilots cannot
  report them. If qualified networks fall below 100 after QC, use the
  already-written 3-station/6-year hatch and report it; do not call
  HUC8 that hatch. If the two-tier budget cannot be run, write a
  budget miss; do not shrink the roster after download.
  design_freeze_v4 stays executable.
