query DailyWaterTemperatureV2(
  $station: String!
  $from: AWSDateTime!
  $to: AWSDateTime!
) {
  water {
    observations {
      data_1day_mean(
        where: {
          station: { no: { _eq: $station } }
          parameterName: { _eq: "WT" }
          timestamp: { _gte: $from, _lt: $to }
        }
        limit: 10000
      ) {
        timestamp
        parameterName
        value
        unitSymbol
        releaseState
        station {
          no
        }
      }
    }
  }
}
