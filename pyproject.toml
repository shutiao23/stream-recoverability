[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-recoverability"
version = "0.1.0"
description = "Reproducible stream-temperature recoverability experiments for the Jinsha River monitoring network."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "seaborn>=0.12",
  "statsmodels>=0.14",
  "torch>=2.0",
  "xgboost>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
