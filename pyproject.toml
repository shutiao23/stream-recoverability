[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-recoverability"
version = "1.2.0"
description = "Leakage-safe benchmarking of gap handling for annual heat extremes and river-temperature trends."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pyarrow>=12",
  "PyYAML>=6",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "seaborn>=0.12",
  "statsmodels>=0.14",
  "torch>=2.0",
  "xgboost>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
reference = ["pypots==1.5"]
revision = ["shapely>=2,<3", "pyproj>=3.7,<4", "numba>=0.59,<1"]
review = ["lightgbm>=4.6,<5", "requests>=2.31,<3", "tabulate>=0.9,<1", "pypots==1.5", "conditionalconformal==0.0.4", "cvxpy==1.6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
