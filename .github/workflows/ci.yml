name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project, test, and reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reference]"
          python -m pip install "ruff==0.16.2"

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Check reachable package sources
        run: ruff check --select E4,E7,E9,F src

      - name: Run the complete test suite
        run: python -m pytest
