name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            constraints.in

      - name: Install project, test, and reference dependencies from constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints.txt \
            -e ".[dev,reference]"
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints.txt \
            build wheel
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -c constraints.txt \
            ruff

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - name: Check Python syntax
        run: python -m compileall -q src scripts tests

      - name: Check reachable package sources
        run: ruff check --select E4,E7,E9,F src

      - name: Run the complete test suite
        run: python -m pytest
