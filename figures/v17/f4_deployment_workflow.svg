<polyline points="290.0,421.0 290.0,443.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="290.0,521.0 290.0,543.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="290.0,605.0 290.0,627.0" fill="none" stroke="#C62828" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="290.0,725.0 290.0,747.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="780.0,165.0 780.0,189.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="599.0,399.1 580.0,400.0 580.0,464.0 561.0,465.2" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="6 4"/>
<polyline points="599.0,556.0 580.0,556.0 580.0,574.0 561.0,574.0" fill="none" stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="6 4"/>
</g></svg>