<svg xmlns="http://www.w3.org/2000/svg" width="5.500in" height="4.854in" viewBox="0 0 988 872">
<title>Agency deployment workflow</title>
<rect width="988" height="872" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker><marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker></defs>
<g transform="translate(4.0,4.0)">
<rect x="20.0" y="628.0" width="540.0" height="96.0" rx="10" ry="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/>
<text x="290.0" y="654.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#B71C1C" text-anchor="middle" font-weight="600" xml:space="preserve">Guardrail: check what the rule keeps</text>
<text x="290.0" y="672.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">retention by elevation, slope, donor availability;</text>
<text x="290.0" y="691.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">if the archived set is not representative, apply</text>
<text x="290.0" y="709.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">the threshold within stratum (about 0.3 points)</text>
<rect x="20.0" y="748.0" width="540.0" height="96.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="290.0" y="774.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">What the substitution buys, at 70% retention</text>
<text x="290.0" y="792.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">on the retrospective 36-network holdout:</text>
<text x="290.0" y="811.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">9.7% → 2.5% for the calibrated screen;</text>
<text x="290.0" y="829.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">the three-variable rule gives 4.2%</text>
<rect x="600.0" y="320.0" width="360.0" height="140.0" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.4"/>
<text x="780.0" y="342.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" font-weight="600" xml:space="preserve">For an uncertainty statement in °C</text>
<text x="780.0" y="359.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">run the calibrated screen and report</text>
<text x="780.0" y="377.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">its interval. A pooled interval speaks</text>
<text x="780.0" y="395.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">for a population of networks, not for</text>
<text x="780.0" y="413.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">one site; cluster calibration stays</text>
<text x="780.0" y="431.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">exploratory until it is validated</text>
<text x="780.0" y="449.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">outside the development programme.</text>
<rect x="600.0" y="494.0" width="360.0" height="124.0" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.4"/>
<text x="780.0" y="516.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" font-weight="600" xml:space="preserve">For a single threshold judgement</text>
<text x="780.0" y="534.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">do not discard the year: abstaining</text>
<text x="780.0" y="552.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">where the interval straddles the</text>
<text x="780.0" y="570.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">threshold judges 92.7% of years at</text>
<text x="780.0" y="588.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">0.42%, against 67.5% at 0.36% for</text>
<text x="780.0" y="606.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">screening at the same tolerance.</text>
<rect x="20.0" y="244.0" width="540.0" height="76.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="290.0" y="269.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Locate the climatological peak window</text>
<text x="290.0" y="287.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">from the station's own complete years;</text>
<text x="290.0" y="306.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">no data beyond its own record is needed</text>
<rect x="20.0" y="344.0" width="540.0" height="76.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="290.0" y="369.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Three numbers from the outage mask alone</text>
<text x="290.0" y="387.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">peak_overlap · warm_observed_fraction ·</text>
<text x="290.0" y="406.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">longest_run_days</text>
<rect x="20.0" y="444.0" width="540.0" height="76.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="290.0" y="469.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">risk = logistic(−1.302 + 2.070 · peak_overlap</text>
<text x="290.0" y="487.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">− 2.412 · warm_observed_fraction</text>
<text x="290.0" y="505.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">− 0.00187 · longest_run_days)</text>
<rect x="600.0" y="190.0" width="360.0" height="92.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="780.0" y="214.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Keep the length-based rule</text>
<text x="780.0" y="232.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">threshold the number of missing days;</text>
<text x="780.0" y="250.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">length is the better axis here</text>
<text x="780.0" y="268.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">(annual mean AUC 0.845 against 0.672)</text>
<rect x="20.0" y="164.0" width="540.0" height="60.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="290.0" y="190.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">A warm-season extreme</text>
<text x="290.0" y="209.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">hottest 7-day or 30-day mean</text>
<rect x="20.0" y="544.0" width="540.0" height="60.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="290.0" y="570.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Rank by risk and admit to the retention</text>
<text x="290.0" y="589.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">the monitoring programme can afford</text>
<rect x="20.0" y="20.0" width="540.0" height="52.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="290.0" y="52.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">A station-year with an outage reaches the archive</text>
<rect x="20.0" y="92.0" width="540.0" height="52.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="290.0" y="124.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Which statistic will be computed?</text>
<rect x="600.0" y="92.0" width="360.0" height="72.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="780.0" y="115.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">An average or sine-fit parameter</text>
<text x="780.0" y="133.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">annual mean, coldest 30-day mean,</text>
<text x="780.0" y="151.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">sine-fit mean, phase, amplitude</text>
