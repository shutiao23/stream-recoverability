<svg xmlns="http://www.w3.org/2000/svg" width="5.500in" height="4.498in" viewBox="0 0 988 808">
<title>Screening system architecture</title>
<rect width="988" height="808" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker><marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker></defs>
<g transform="translate(4.0,4.0)">
<rect x="20.0" y="20.0" width="430.0" height="336.0" rx="10" ry="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="235.0" y="41.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#37474F" text-anchor="middle" font-weight="600" xml:space="preserve">Visible at decision time</text>
<rect x="20.0" y="690.0" width="940.0" height="90.0" rx="10" ry="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.4"/>
<text x="490.0" y="713.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" font-weight="600" xml:space="preserve">Notes on fitting and evaluation</text>
<text x="490.0" y="731.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">Fitted leave-one-year-out within the station; a prior-years-only refit is reported as a sensitivity.</text>
<text x="490.0" y="749.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">Absent donor columns are never imputed; the model is refit on the visible subset. Fitting, calibration</text>
<text x="490.0" y="767.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#795548" text-anchor="middle" xml:space="preserve">and test networks are always disjoint, and every interval resamples whole networks.</text>
<rect x="490.0" y="328.0" width="470.0" height="124.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="725.0" y="350.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Split-conformal calibration</text>
<text x="725.0" y="368.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">selection-conditional: calibrated after the estimator</text>
<text x="725.0" y="386.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">is chosen, because taking the smallest of several</text>
<text x="725.0" y="404.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">bounds is a winner's curse that per-estimator</text>
<text x="725.0" y="422.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">calibration cannot see; multiplicative, because the</text>
<text x="725.0" y="440.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">error scale spans an order of magnitude</text>
<rect x="490.0" y="20.0" width="470.0" height="110.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="725.0" y="44.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Estimator library — support declared per case</text>
<text x="725.0" y="62.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">observed days (current practice) · day-of-year climatology</text>
<text x="725.0" y="80.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">smoothed climatology · linear interpolation (both flanks</text>
<text x="725.0" y="98.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">required) · donor ridge (refit on visible donors) ·</text>
<text x="725.0" y="116.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">air ridge (where forcing exists)</text>
<rect x="490.0" y="560.0" width="470.0" height="105.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="725.0" y="582.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Action space 2 — abstention</text>
<text x="725.0" y="600.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">keep every year and abstain only where the interval</text>
<text x="725.0" y="618.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">straddles the threshold; decides what one judgement may</text>
<text x="725.0" y="636.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">say. Judges 92.7% of years at 0.42% misclassification,</text>
<text x="725.0" y="654.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">against 67.5% at 0.36% for screening at 0.5 °C.</text>
<rect x="20.0" y="560.0" width="430.0" height="96.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="235.0" y="586.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Action space 1 — admission</text>
<text x="235.0" y="604.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">retain or exclude the year at a tolerance τ in °C;</text>
<text x="235.0" y="622.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">decides what enters the archive. Reserved panel at</text>
<text x="235.0" y="640.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">70% retention: 2.5% against 9.7% for the length rule.</text>
<rect x="490.0" y="468.0" width="470.0" height="76.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="725.0" y="493.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Calibrated certificate for this station-year</text>
<text x="725.0" y="511.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">an interval on the completed-year statistic, in °C,</text>
<text x="725.0" y="529.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">and a risk score</text>
<rect x="490.0" y="170.0" width="470.0" height="70.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="725.0" y="192.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Risk model</text>
<text x="725.0" y="210.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" xml:space="preserve">predicted upper bound on | q(ŷ) − q(y) |</text>
<text x="725.0" y="228.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" xml:space="preserve">for each supported estimator</text>
<rect x="20.0" y="396.0" width="430.0" height="76.0" rx="10" ry="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/>
<text x="235.0" y="421.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#B71C1C" text-anchor="middle" font-weight="600" xml:space="preserve">Information barrier</text>
<text x="235.0" y="439.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">no feature may read a day the outage hides;</text>
<text x="235.0" y="457.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">enforced in the feature constructor and by a test</text>
<rect x="490.0" y="260.0" width="470.0" height="48.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="725.0" y="289.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Estimator selection — take the smallest bound</text>
<rect x="36.0" y="62.0" width="398.0" height="48.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="235.0" y="82.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Outage geometry</text>
<text x="235.0" y="100.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">longest run, total missing, number of runs</text>
<rect x="36.0" y="116.0" width="398.0" height="48.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="235.0" y="136.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Support of the estimand</text>
<text x="235.0" y="154.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">peak-window overlap, warm-season share</text>
<rect x="36.0" y="170.0" width="398.0" height="48.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="235.0" y="190.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Constraint from the observed days</text>
<text x="235.0" y="208.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">observed-peak margin, which flanks survived</text>
<rect x="36.0" y="224.0" width="398.0" height="48.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="235.0" y="244.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Donor information</text>
<text x="235.0" y="262.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">count, coverage, deseasonalised correlation</text>
<rect x="36.0" y="278.0" width="398.0" height="48.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="235.0" y="298.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Station history</text>
<text x="235.0" y="316.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">record length, residual scale, amplitude</text>
<polyline points="235.0,395.0 235.0,357.0" fill="none" stroke="#C62828" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="137.5" y="365.5" width="195.0" height="20.9" fill="#ffffff" stroke="none"/>
<text x="235.0" y="378.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">enforced on every feature</text>
<polyline points="451.0,178.8 470.0,178.0 470.0,90.0 489.0,88.9" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="451.0,245.0 470.0,250.0 470.0,208.0 489.0,207.8" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="725.0,131.0 725.0,169.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="631.3" y="139.5" width="187.4" height="20.9" fill="#ffffff" stroke="none"/>
<text x="725.0" y="152.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#455a64" text-anchor="middle" xml:space="preserve">completed-year statistic</text>
<polyline points="725.0,241.0 725.0,259.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="725.0,309.0 725.0,327.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="642.6" y="307.5" width="164.8" height="20.9" fill="#ffffff" stroke="none"/>
<text x="725.0" y="320.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#455a64" text-anchor="middle" xml:space="preserve">selection-conditional</text>
<polyline points="725.0,453.0 725.0,467.0" fill="none" stroke="#37474F" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="725.0,545.0 725.0,550.0 235.0,550.0 235.0,559.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="725.0,545.0 725.0,559.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#arrow)"/>
</g></svg>