<text x="587.5" y="294.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">conditioning set</text>
<text x="587.5" y="310.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">ignores the support</text>
