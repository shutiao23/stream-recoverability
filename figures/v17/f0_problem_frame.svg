<svg xmlns="http://www.w3.org/2000/svg" width="5.500in" height="3.538in" viewBox="0 0 998 642">
<title>Problem frame</title>
<rect width="998" height="642" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker><marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker></defs>
<g transform="translate(4.0,4.0)">
<rect x="20.0" y="514.0" width="950.0" height="100.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="495.0" y="541.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">One scale, not two regimes: measure missingness on the support of the estimand.</text>
<text x="495.0" y="560.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">‘Timing versus length’ is that scale at its two ends; the crossing is an interval, 77 to 107 days.</text>
<text x="495.0" y="579.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">The conditioning set is the support dilated by the wander of its own location:</text>
<text x="495.0" y="598.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">one agency window of 60 to 90 days serves every warm-season endpoint.</text>
<rect x="20.0" y="20.0" width="950.0" height="76.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="495.0" y="54.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">A station-year  y = (y₁ … y_T),  T ∈ {365, 366},  with an outage mask  m ∈ {0,1}^T</text>
<text x="495.0" y="73.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">the analyst sees only the days where m_t = 0</text>
<rect x="330.0" y="126.0" width="290.0" height="110.0" rx="10" ry="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/>
<text x="475.0" y="148.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#B71C1C" text-anchor="middle" font-weight="600" xml:space="preserve">Incumbent completeness rule</text>
<text x="475.0" y="167.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">s(m) = 1{ max run(m) ≤ θ }</text>
<text x="475.0" y="187.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">Conditioning set: the size of</text>
<text x="475.0" y="206.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">the outage. Applied to every</text>
<text x="475.0" y="225.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#B71C1C" text-anchor="middle" xml:space="preserve">estimand alike.</text>
<rect x="640.0" y="398.0" width="330.0" height="86.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="805.0" y="428.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">Measured on the same cases</text>
<text x="805.0" y="446.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">error grows 3.5× along missing days</text>
<text x="805.0" y="464.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">and 9.6× along peak-window overlap</text>
<rect x="20.0" y="398.0" width="300.0" height="86.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="170.0" y="428.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">Measured on 40,704 development cases</text>
<text x="170.0" y="446.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">error grows 10.2× along missing days</text>
<text x="170.0" y="464.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">and 1.5× along peak-window overlap</text>
<rect x="640.0" y="126.0" width="330.0" height="68.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="805.0" y="156.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Estimand B — hottest 30-day mean</text>
<text x="805.0" y="174.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">q(y) = max_t (1/30) Σ_{i=t..t+29} y_i</text>
<rect x="640.0" y="220.0" width="330.0" height="68.0" rx="10" ry="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.4"/>
<text x="805.0" y="250.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#37474F" text-anchor="middle" xml:space="preserve">Support: one 30-day window W_q,</text>
<text x="805.0" y="268.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#37474F" text-anchor="middle" xml:space="preserve">located by the station's own climatology</text>
<rect x="640.0" y="310.0" width="330.0" height="68.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="805.0" y="340.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Governing axis</text>
<text x="805.0" y="358.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" xml:space="preserve">how much of W_q is hidden</text>
<rect x="20.0" y="126.0" width="300.0" height="68.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="170.0" y="156.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Estimand A — annual mean</text>
<text x="170.0" y="174.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#102027" text-anchor="middle" xml:space="preserve">q(y) = (1/T) Σ_t y_t</text>
<rect x="20.0" y="220.0" width="300.0" height="68.0" rx="10" ry="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.4"/>
<text x="170.0" y="250.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#37474F" text-anchor="middle" xml:space="preserve">Support: all T days,</text>
<text x="170.0" y="268.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#37474F" text-anchor="middle" xml:space="preserve">each carrying weight 1/T</text>
<rect x="20.0" y="310.0" width="300.0" height="68.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="170.0" y="340.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Governing axis</text>
<text x="170.0" y="358.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.0" fill="#E65100" text-anchor="middle" xml:space="preserve">how many days are missing</text>
