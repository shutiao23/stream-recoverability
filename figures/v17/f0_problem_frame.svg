<svg xmlns="http://www.w3.org/2000/svg" width="968" height="674" viewBox="0 0 968 674">
<title>Problem frame</title>
<rect width="968" height="674" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker><marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker></defs>
<g transform="translate(-76.0,4.0)">
<rect x="140.0" y="560.0" width="840.0" height="86.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="560.0" y="583.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">One law, not two regimes:  measure missingness on the support of the estimand.</text>
<text x="560.0" y="600.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">‘Timing versus length’ is that law at the two ends of a scale; the crossover is at a support width of 91 days.</text>
<text x="560.0" y="616.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">A support must be located before it can be conditioned on, so the conditioning set is the support dilated by the</text>
<text x="560.0" y="633.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">year-to-year wander of its own location — one window of 60 to 90 days serves every warm-season endpoint.</text>
<rect x="420.0" y="140.0" width="280.0" height="154.0" rx="10" ry="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/>
<text x="560.0" y="190.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">Incumbent completeness rule</text>
<text x="560.0" y="206.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">s(m) = 1{ max run(m) ≤ θ }</text>
<text x="560.0" y="222.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve"></text>
<text x="560.0" y="238.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">Conditioning set: the size of the outage.</text>
<text x="560.0" y="254.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#B71C1C" text-anchor="middle" xml:space="preserve">Applied to every estimand alike.</text>
<rect x="300.0" y="20.0" width="520.0" height="62.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="560.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">A station-year  y = (y₁ … y_T),  T ∈ {365, 366}</text>
<text x="560.0" y="64.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">with an outage mask  m ∈ {0,1}^T ;  the analyst sees only the days where mₜ = 0</text>
<rect x="100.0" y="446.0" width="290.0" height="66.0" rx="0" ry="0" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="245.0" y="469.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">Measured on 40,704 development cases</text>
<text x="245.0" y="483.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">error grows 10.2× along missing days</text>
<text x="245.0" y="498.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">and 1.5× along peak-window overlap</text>
<rect x="730.0" y="446.0" width="290.0" height="66.0" rx="0" ry="0" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="875.0" y="469.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">Measured on the same cases</text>
<text x="875.0" y="483.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">error grows 3.5× along missing days</text>
<text x="875.0" y="498.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#1B5E20" text-anchor="middle" xml:space="preserve">and 9.6× along peak-window overlap</text>
<rect x="100.0" y="140.0" width="290.0" height="62.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="245.0" y="168.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Estimand A — annual mean</text>
<text x="245.0" y="184.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">q(y) = (1/T) Σₜ yₜ</text>
<rect x="730.0" y="140.0" width="290.0" height="62.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="875.0" y="168.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Estimand B — hottest 30-day mean</text>
<text x="875.0" y="184.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">q(y) = maxₜ (1/30) Σᵢ₊ₜ yᵢ</text>
<rect x="100.0" y="238.0" width="290.0" height="56.0" rx="0" ry="0" fill="#FFFFFF" stroke="#78909C" stroke-width="1.4"/>
<text x="245.0" y="263.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.0" fill="#102027" text-anchor="middle" xml:space="preserve">Support: all T days,</text>
<text x="245.0" y="278.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.0" fill="#102027" text-anchor="middle" xml:space="preserve">each carrying weight 1/T</text>
<rect x="730.0" y="238.0" width="290.0" height="56.0" rx="0" ry="0" fill="#FFFFFF" stroke="#78909C" stroke-width="1.4"/>
<text x="875.0" y="263.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.0" fill="#102027" text-anchor="middle" xml:space="preserve">Support: one 30-day window W_q,</text>
<text x="875.0" y="278.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.0" fill="#102027" text-anchor="middle" xml:space="preserve">located by the station's own climatology</text>
<rect x="100.0" y="352.0" width="290.0" height="56.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="245.0" y="377.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Governing axis</text>
<text x="245.0" y="393.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">how many days are missing</text>
<rect x="730.0" y="352.0" width="290.0" height="56.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="875.0" y="377.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Governing axis</text>
<text x="875.0" y="393.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">how much of W_q is hidden</text>
