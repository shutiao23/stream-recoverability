<text x="357.5" y="294.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">conditioning set</text>
<text x="357.5" y="310.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">matches the support</text>
<polyline points="475.0,237.0 475.0,300.0 700.0,300.0 721.5,309.0" fill="none" stroke="#C62828" stroke-width="1.4" marker-end="url(#arrow)"/>
