<svg xmlns="http://www.w3.org/2000/svg" width="5.500in" height="5.227in" viewBox="0 0 968 920">
<title>Study design and data flow</title>
<rect width="968" height="920" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker><marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker></defs>
<g transform="translate(4.0,4.0)">
<rect x="20.0" y="462.0" width="450.0" height="130.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="245.0" y="494.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Sealed USGS confirmation</text>
<text x="245.0" y="514.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">39 HUC4 networks · 91 stations ·</text>
<text x="245.0" y="533.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">8,973 designed cases, outside the</text>
<text x="245.0" y="552.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">development programme; scored once</text>
<text x="245.0" y="571.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">−7.9 points [−10.2, −5.8]</text>
<rect x="20.0" y="20.0" width="450.0" height="128.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="245.0" y="71.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Nine national providers</text>
<text x="245.0" y="90.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">ARSO · CHMI · FOEN · GKD Bayern ·</text>
<text x="245.0" y="109.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">LUBW · NVE · Rijkswaterstaat · SYKE · USGS</text>
<rect x="20.0" y="304.0" width="450.0" height="128.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="245.0" y="327.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Outages designed, configuration frozen</text>
<text x="245.0" y="346.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">51,524 cases; empirical and stratified arms</text>
<text x="245.0" y="364.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">40,704 development · 10,820 reserved</text>
<text x="245.0" y="383.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">declared before the reserved panel opened</text>
<text x="245.0" y="401.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">matched retention; at least five points;</text>
<text x="245.0" y="420.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#102027" text-anchor="middle" xml:space="preserve">a network-clustered interval excluding zero</text>
<rect x="20.0" y="622.0" width="450.0" height="128.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="245.0" y="644.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Pre-registered transport panel</text>
<text x="245.0" y="663.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">SMHI · UK EA · Hub'Eau: 32 primary</text>
<text x="245.0" y="682.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">networks across three contexts,</text>
<text x="245.0" y="701.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">four assurance strata combinations,</text>
<text x="245.0" y="721.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">sealed and scored once: −4.6 points</text>
<text x="245.0" y="740.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">[−6.5, −3.3]</text>
<rect x="510.0" y="462.0" width="430.0" height="130.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="725.0" y="494.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Prior-access audit and clean subset</text>
<text x="725.0" y="514.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">24 of 39 networks appear in earlier work</text>
<text x="725.0" y="533.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">15 outcome-clean networks: −9.4 points</text>
<text x="725.0" y="552.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">[−12.4, −6.0]; a transparency diagnostic,</text>
<text x="725.0" y="571.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">not new confirmation</text>
<rect x="510.0" y="20.0" width="430.0" height="128.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="725.0" y="42.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">River-only, complete-year filter</text>
<text x="725.0" y="61.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">lakes, seas, canals, estuaries, deltas out</text>
<text x="725.0" y="80.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">a year with any missing day: no truth</text>
<text x="725.0" y="99.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">fewer than four complete years: out</text>
<text x="725.0" y="119.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">146 networks · 457 stations ·</text>
<text x="725.0" y="138.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">5,114 completely observed station-years</text>
<rect x="510.0" y="304.0" width="430.0" height="128.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="725.0" y="345.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Reserved panel opened once</text>
<text x="725.0" y="364.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">9.7% → 2.5% at 70% retention</text>
<text x="725.0" y="383.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">−7.13 points [−8.97, −5.36]</text>
<text x="725.0" y="403.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">the empirical arm is unresolved</text>
<rect x="510.0" y="622.0" width="430.0" height="128.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="725.0" y="653.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Primary and secondary strata</text>
<text x="725.0" y="673.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">quality-checked stratum: −6.2 points</text>
<text x="725.0" y="692.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">[−8.4, −4.5], agreeing with the pooled</text>
<text x="725.0" y="711.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">verdict; NVE secondary stratum,</text>
<text x="725.0" y="730.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">21 networks: −6.1 points [−8.7, −4.6]</text>
<rect x="20.0" y="780.0" width="450.0" height="112.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="245.0" y="813.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Truth-free deployment</text>
<text x="245.0" y="832.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">2,422 real incomplete station-years,</text>
<text x="245.0" y="851.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">which carry no truth; the frozen</text>
<text x="245.0" y="870.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">screen is applied to them unchanged</text>
<rect x="510.0" y="780.0" width="430.0" height="112.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="725.0" y="803.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Two admission rules compared</text>
<text x="725.0" y="823.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">length rule vs peak-window screening</text>
<text x="725.0" y="842.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">disagree on 15.1% of the 2,422 years;</text>
<text x="725.0" y="861.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">the certificate instead supports abstention</text>
<text x="725.0" y="880.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">where the interval straddles the threshold</text>
<rect x="20.0" y="178.0" width="450.0" height="96.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="245.0" y="203.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Split at the network level</text>
<text x="245.0" y="222.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">never at the station-year level;</text>
<text x="245.0" y="241.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">stratified on provider × donor regime</text>
<text x="245.0" y="261.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">110 development · 36 reserved</text>
<rect x="510.0" y="178.0" width="430.0" height="96.0" rx="10" ry="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.4"/>
<text x="725.0" y="203.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#37474F" text-anchor="middle" font-weight="600" xml:space="preserve">Reserved panel: retrospective holdout</text>
<text x="725.0" y="222.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#37474F" text-anchor="middle" xml:space="preserve">28 of 36 networks have earlier</text>
<text x="725.0" y="241.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#37474F" text-anchor="middle" xml:space="preserve">programme use; not an unused</text>
<text x="725.0" y="261.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#37474F" text-anchor="middle" xml:space="preserve">confirmation set for new analyses</text>
