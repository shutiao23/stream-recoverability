<svg xmlns="http://www.w3.org/2000/svg" width="5.500in" height="5.723in" viewBox="0 0 963 1002">
<title>Evidence chain and closure</title>
<rect width="963" height="1002" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker><marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a4ae"/></marker></defs>
<g transform="translate(4.0,4.0)">
<rect x="20.0" y="20.0" width="900.0" height="76.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="470.0" y="54.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Real archive — sample fact</text>
<text x="470.0" y="73.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">nine agencies, 146 networks, 457 stations, 5,114 fully observed station-years</text>
<rect x="20.0" y="122.0" width="900.0" height="76.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="470.0" y="156.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Designed outages — sample fact</text>
<text x="470.0" y="175.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">51,524 cases on an empirical and a stratified arm; 40,704 development, 10,820 reserved</text>
<rect x="20.0" y="224.0" width="900.0" height="76.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="470.0" y="249.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Q1 · which property of a gap governs the error? — sample fact</text>
<text x="470.0" y="268.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">an annual mean grows 10.2× along missing days and 1.5× along peak-window overlap;</text>
<text x="470.0" y="287.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">the hottest 30-day mean reverses both (3.5× and 9.6×)</text>
<rect x="20.0" y="326.0" width="900.0" height="76.0" rx="10" ry="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.4"/>
<text x="470.0" y="350.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" font-weight="600" xml:space="preserve">Q2 · two regimes or a continuum? — exploratory post-open</text>
<text x="470.0" y="370.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">the crossing is an interval, 77 to 107 days; the 90-day point is indistinguishable from zero</text>
<text x="470.0" y="389.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#E65100" text-anchor="middle" xml:space="preserve">the conditioning set is the support dilated by about two location SDs (60 to 90 days)</text>
<rect x="20.0" y="428.0" width="900.0" height="76.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="470.0" y="452.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Q3 · what does conditioning change? — retrospective holdout</text>
<text x="470.0" y="472.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">36 reserved networks opened once: 9.7% → 2.5% at 70% retention, −7.13 points</text>
<text x="470.0" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">[−8.97, −5.36]; the empirical arm is unresolved</text>
<rect x="20.0" y="530.0" width="900.0" height="76.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="470.0" y="554.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Sealed confirmation, USGS — sealed confirmation</text>
<text x="470.0" y="574.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">39 HUC4 networks, 8,973 cases, scored once: −7.9 points [−10.2, −5.8];</text>
<text x="470.0" y="593.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">the 15 outcome-clean networks give −9.4 points [−12.4, −6.0]</text>
<rect x="20.0" y="632.0" width="900.0" height="76.0" rx="10" ry="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="470.0" y="656.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" font-weight="600" xml:space="preserve">Multi-agency transport — sealed confirmation</text>
<text x="470.0" y="676.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">32 pre-registered primary networks: −4.6 points [−6.5, −3.3]; quality-checked</text>
<text x="470.0" y="695.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#0D47A1" text-anchor="middle" xml:space="preserve">stratum −6.2 [−8.4, −4.5]; NVE secondary stratum, 21 networks, −6.1 [−8.7, −4.6]</text>
<rect x="20.0" y="734.0" width="900.0" height="76.0" rx="10" ry="10" fill="#FFFFFF" stroke="#37474F" stroke-width="1.4"/>
<text x="470.0" y="758.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" font-weight="600" xml:space="preserve">Truth-free deployment — sample fact, no truth read</text>
<text x="470.0" y="778.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">2,422 real incomplete station-years: the two admission rules disagree on 15.1%;</text>
<text x="470.0" y="797.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#102027" text-anchor="middle" xml:space="preserve">wholly hidden climatological peak windows are a proxy (PPV 0.74)</text>
<rect x="20.0" y="836.0" width="900.0" height="76.0" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="470.0" y="860.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Consequence — sample fact</text>
<text x="470.0" y="880.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">admitting incomplete years raises the archive mean by about 0.5 °C and the four</text>
<text x="470.0" y="899.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" xml:space="preserve">rules differ by less than 0.1 °C; at the 140-day limit 17 admitted years hide the peak window</text>
<rect x="20.0" y="944.0" width="900.0" height="30.0" rx="0" ry="0" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
<text x="470.0" y="965.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15.0" fill="#1B5E20" text-anchor="middle" font-weight="600" xml:space="preserve">Pooled designed outages close the loop; the empirical arm stays open.</text>
